<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#F7F5F0; --surface:#FFFFFF; --ink:#1B1F2E; --ink-muted:#5C6070; --border:#E4E0D6; --primary:#1E2A5A; --accent:#E0902C; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Work Sans',-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
    .font-display { font-family:'Fraunces',Georgia,serif; }
    .avatar { width:52px; height:52px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; background:#1E2A5A; border:2px solid #1E2A5A; }
    .avatar.karta { border:3px solid var(--accent); }
    .avatar.deceased { background:#B9B4A6; border:2px dashed #9AA0B0; filter:grayscale(1); opacity:.75; }
    .node { display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; width:96px; }
  </style>
</helmet>

<div style="width:390px; height:844px; display:flex; flex-direction:column; background:var(--bg);">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; border-bottom:1px solid var(--border); background:#fff;">
    <div>
      <div class="font-display" style="font-size:15px; font-weight:600;">Ladwani Family Tree</div>
      <div style="font-size:11px; color:var(--ink-muted);">3 generations · 7 members</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C6070" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </div>

  <div style="flex:1; overflow:auto; padding:24px 12px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:0;">

      <div style="display:flex; gap:24px;">
        <div class="node"><div class="avatar deceased">GL</div><div style="font-size:11px; font-weight:600;">Govind</div><div style="font-size:9px; color:var(--ink-muted);">Deceased</div></div>
        <div class="node"><div class="avatar deceased">KL</div><div style="font-size:11px; font-weight:600;">Kamala</div><div style="font-size:9px; color:var(--ink-muted);">Deceased</div></div>
      </div>

      <div style="width:1px; height:26px; background:var(--border);"></div>

      <div style="display:flex; gap:16px;">
        <div class="node"><div class="avatar">SL</div><div style="font-size:11px; font-weight:600;">Suresh</div><div style="font-size:9px; color:var(--ink-muted);">55, Nagpur</div></div>
        <div class="node">
          <div class="avatar karta">RL</div>
          <div style="display:flex; align-items:center; gap:3px;"><span style="font-size:11px; font-weight:700;">Ramesh</span><span style="font-size:8px; font-weight:700; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:1px 4px;">KARTA</span></div>
          <div style="font-size:9px; color:var(--ink-muted);">52, Pune</div>
        </div>
        <div class="node"><div class="avatar" style="background:#4A6670; border-color:#4A6670;">SN</div><div style="font-size:11px; font-weight:600;">Sunita</div><div style="font-size:9px; color:var(--ink-muted);">48, Pune</div></div>
      </div>

      <div style="width:1px; height:26px; background:var(--border);"></div>

      <div style="display:flex; gap:20px;">
        <div class="node"><div class="avatar">AL</div><div style="font-size:11px; font-weight:600;">Aniket</div><div style="font-size:9px; color:var(--ink-muted);">27, Unmarried</div></div>
        <div class="node"><div class="avatar" style="background:#4A6670; border-color:#4A6670;">PL</div><div style="font-size:11px; font-weight:600;">Pooja</div><div style="font-size:9px; color:var(--ink-muted);">24, Unmarried</div></div>
      </div>

    </div>
  </div>

  <div style="display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; background:#fff; border-top:1px solid var(--border); font-size:11px; color:var(--ink-muted);">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6070" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    Pinch to zoom · Tap a member to view profile
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
