<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#F7F5F0; --surface:#FFFFFF; --ink:#1B1F2E; --ink-muted:#5C6070; --border:#E4E0D6; --primary:#1E2A5A; --accent:#E0902C; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Work Sans',-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
    h1,.font-display { font-family:'Fraunces',Georgia,serif; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; }
    label { font-size:13px; font-weight:600; color:var(--ink-muted); display:block; margin-bottom:6px; }
    input { width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border); font-size:15px; font-family:'Work Sans',sans-serif; background:#fff; }
    .btn-accent { display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
    a { color:var(--primary); text-decoration:none; font-weight:600; }
  </style>
</helmet>

<div style="width:1440px; height:900px; display:flex;">
  <div style="flex:1; display:flex; align-items:center; justify-content:center;">
    <div class="card" style="width:420px; padding:40px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:28px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="1.6"><path d="M12 3v6M12 21v-4M6 21v-8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8M4 9h4M16 9h4M9 9V6a3 3 0 0 1 6 0v3"/></svg>
        <span class="font-display" style="font-size:19px; font-weight:600;">Mi Samaj</span>
      </div>
      <h1 style="font-size:26px; margin:0 0 6px; color:var(--primary);">Welcome back</h1>
      <p style="color:var(--ink-muted); font-size:14px; margin:0 0 28px;">Sign in to your community account</p>

      <div style="display:flex; flex-direction:column; gap:18px;">
        <div>
          <label>Mobile Number or Email</label>
          <input type="text" value="9876543210" readonly>
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <label>Password</label>
            <a href="#" style="font-size:13px;">Forgot password?</a>
          </div>
          <input type="password" value="••••••••" readonly>
        </div>
        <div class="btn-accent">Sign In</div>
      </div>

      <p style="text-align:center; font-size:14px; color:var(--ink-muted); margin-top:24px;">New to the platform? <a href="#">Create an account</a></p>
    </div>
  </div>

  <div style="flex:1; background:var(--primary); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
    <svg width="120%" height="120%" viewBox="0 0 400 400" style="position:absolute; opacity:.12;">
      <circle cx="200" cy="60" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="100" cy="180" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="300" cy="180" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="60" cy="300" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="160" cy="300" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="260" cy="300" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="340" cy="300" r="30" fill="none" stroke="#fff" stroke-width="1.5"/>
      <line x1="200" y1="90" x2="200" y2="150" stroke="#fff" stroke-width="1.5"/>
      <line x1="100" y1="150" x2="300" y2="150" stroke="#fff" stroke-width="1.5"/>
      <line x1="100" y1="150" x2="100" y2="150" stroke="#fff" stroke-width="1.5"/>
      <line x1="100" y1="210" x2="100" y2="270" stroke="#fff" stroke-width="1.5"/>
      <line x1="60" y1="270" x2="160" y2="270" stroke="#fff" stroke-width="1.5"/>
      <line x1="300" y1="210" x2="300" y2="270" stroke="#fff" stroke-width="1.5"/>
      <line x1="260" y1="270" x2="340" y2="270" stroke="#fff" stroke-width="1.5"/>
    </svg>
    <div style="position:relative; text-align:center; color:#fff; max-width:380px; padding:0 24px;">
      <h1 style="font-size:30px; margin:0 0 12px; color:#fff;">Family, community, and trust — together.</h1>
      <p style="font-size:15px; opacity:.85; line-height:1.6;">Join 6,800+ members from the Ladwani Samaj already building their family trees and staying connected.</p>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
