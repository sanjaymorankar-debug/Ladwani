<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#F7F5F0; --surface:#FFFFFF; --ink:#1B1F2E; --ink-muted:#5C6070; --border:#E4E0D6; --primary:#1E2A5A; --accent:#E0902C; --success:#2F8F5B; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Work Sans',-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
    h1,h2,.font-display { font-family:'Fraunces',Georgia,serif; }
    .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; }
    .tab { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--ink-muted); flex:1; }
    .tab.active { color:var(--primary); font-weight:600; }
  </style>
</helmet>

<div style="width:390px; height:844px; display:flex; flex-direction:column; background:var(--bg); position:relative;">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="1.6"><path d="M12 3v6M12 21v-4M6 21v-8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8M4 9h4M16 9h4M9 9V6a3 3 0 0 1 6 0v3"/></svg>
      <span class="font-display" style="font-size:15px; font-weight:600;">Mi Samaj</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C6070" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <div style="width:28px; height:28px; border-radius:999px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600;">RL</div>
    </div>
  </div>

  <!-- Scroll content -->
  <div style="flex:1; overflow-y:auto; padding:6px 18px 18px; display:flex; flex-direction:column; gap:16px;">

    <div style="background:linear-gradient(120deg, #1E2A5A, #2B3A72); border-radius:12px; padding:20px; color:#fff;">
      <p style="margin:0; opacity:.8; font-size:12px;">Welcome back,</p>
      <h1 style="margin:2px 0 6px; font-size:20px; color:#fff;">Ramesh Ladwani</h1>
      <p style="margin:0; opacity:.85; font-size:12px;">Ladwani Family · Pune</p>
    </div>

    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px;">
      <div class="card" style="padding:16px;">
        <div style="width:34px; height:34px; border-radius:9px; background:#FBF0DE; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C97A22" stroke-width="1.8"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg></div>
        <div style="font-weight:600; font-size:13px;">My Family</div>
      </div>
      <div class="card" style="padding:16px;">
        <div style="width:34px; height:34px; border-radius:9px; background:#E6F3EC; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F8F5B" stroke-width="1.8"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M12 7.2V12M12 12l-4.8 4.6M12 12l4.8 4.6"/></svg></div>
        <div style="font-weight:600; font-size:13px;">Family Tree</div>
      </div>
      <div class="card" style="padding:16px;">
        <div style="width:34px; height:34px; border-radius:9px; background:#EAEEF7; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="1.8"><circle cx="9" cy="7" r="3.2"/><path d="M2 21v-1c0-3 3-5 7-5s7 2 7 5v1"/></svg></div>
        <div style="font-weight:600; font-size:13px;">Directory</div>
      </div>
      <div class="card" style="padding:16px;">
        <div style="width:34px; height:34px; border-radius:9px; background:#F0EBE3; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8C7A5B" stroke-width="1.8"><path d="M12 20s-7-4.4-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 5c-2.5 4.6-9.5 9-9.5 9Z"/></svg></div>
        <div style="font-weight:600; font-size:13px;">Matrimony</div>
      </div>
    </div>

    <div>
      <h2 style="font-size:15px; margin:0 0 10px;">Community Updates</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="card" style="padding:14px; display:flex; gap:10px;">
          <div style="width:32px; height:32px; border-radius:8px; background:#FBF0DE; flex-shrink:0; display:flex; align-items:center; justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C97A22" stroke-width="1.8"><path d="M3 10v4a1 1 0 0 0 1 1h2l5 4V5L6 9H4a1 1 0 0 0-1 1Z"/><path d="M16 9a3 3 0 0 1 0 6"/></svg></div>
          <div>
            <p style="margin:0 0 2px; font-size:11px; color:var(--ink-muted);">Announcement · 2h ago</p>
            <p style="margin:0; font-size:13px; font-weight:600;">Annual Samaj Sammelan — 14th December</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div style="display:flex; align-items:center; padding:10px 8px 18px; border-top:1px solid var(--border); background:#fff;">
    <div class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10"/></svg>Home</div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>Family</div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Search</div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 5c-2.5 4.6-9.5 9-9.5 9Z"/></svg>Matrimony</div>
    <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>Profile</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
