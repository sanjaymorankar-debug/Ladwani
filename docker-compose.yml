version: '3.9'

# Local services only. The app itself runs with `npm run dev` (README.md);
# there is no container image for it. Only postgres is needed: the app does
# not use Redis (it rate-limits in memory), and stores photos on local disk
# unless STORAGE_DRIVER=S3 points it at MinIO.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miladwani
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
