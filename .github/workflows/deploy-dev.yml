# Deploys LadWani (this, the rebuild) to its two dev sites -- and nowhere else.
#
#   web  apps/web  -> devladwani.bkesari.com      (the hub serves it at dev.bkesari.com/ladwani/)
#   api  apps/api  -> devladwani-api.bkesari.com
#
# dev is the only tier with any automation. test and production are promoted by
# hand, deliberately: a mis-aimed deploy to production is the one mistake this
# stage cannot afford. .github/deploy/guard.sh enforces that mechanically, once
# per site, and refuses agtci.com too.
#
# No database credential is stored in GitHub. Each site's environment on the
# server holds them (hPanel's environment variables, or a .env that rsync
# neither writes nor deletes). Migrations are reported, never applied.
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # The ONLY hostnames this workflow may write to, hard-coded rather than taken
  # from secrets, so a mistyped path secret fails the job instead of publishing
  # to the wrong tier. Change them here if the dev sites are renamed.
  WEB_SITE: devladwani.bkesari.com
  API_SITE: devladwani-api.bkesari.com
  # The hub forwards /ladwani/ to the web site WITHOUT stripping the prefix.
  BASE_PATH: /ladwani

jobs:
  # Exactly what CI runs: typecheck, lint, unit tests, migrations and the
  # booking-lock test on a real PostgreSQL, and a full build.
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: dev

    env:
      DEPLOY_HOST: ${{ secrets.DEV_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.DEV_SSH_USER }}
      DEPLOY_PORT: ${{ secrets.DEV_SSH_PORT }}
      WEB_DIR: ${{ secrets.DEV_WEB_PATH }}
      API_DIR: ${{ secrets.DEV_API_PATH }}
      WEB_SMOKE_URL: ${{ vars.DEV_SMOKE_URL }}
      API_SMOKE_URL: ${{ vars.DEV_API_SMOKE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the migration report diffs the real push range.
          fetch-depth: 0

      # Refuses test, production, agtci.com, gokesari.com, a non-dev branch,
      # each site's path pointing at the other's, and any missing secret --
      # before the job holds an SSH connection or a build.
      - name: Refuse anything that is not the web dev site
        env:
          DEV_SITE: ${{ env.WEB_SITE }}
          DEPLOY_DIR: ${{ env.WEB_DIR }}
          SMOKE_URL: ${{ env.WEB_SMOKE_URL }}
          DEPLOY_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: bash .github/deploy/guard.sh

      - name: Refuse anything that is not the API dev site
        env:
          DEV_SITE: ${{ env.API_SITE }}
          DEPLOY_DIR: ${{ env.API_DIR }}
          SMOKE_URL: ${{ env.API_SMOKE_URL }}
          DEPLOY_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: bash .github/deploy/guard.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Read at build time: the web app's /api/v1 rewrite is compiled into
          # its routes, and basePath into every bundle. Public, not secrets.
          NEXT_PUBLIC_API_URL: https://${{ env.API_SITE }}
          # A self-contained server (.next/standalone), so the web site needs
          # no npm install -- see apps/web/next.config.js.
          NEXT_OUTPUT: standalone
        run: |
          set -euo pipefail
          npm run build --workspace=packages/shared-types
          npm run db:generate --workspace=apps/api
          npm run build --workspace=apps/api
          npm run build --workspace=apps/web

      # Each site gets a directory shaped like the repository, holding only
      # what it runs.
      - name: Stage the two sites
        run: |
          set -euo pipefail
          # web: the standalone server, plus the static files Next leaves out
          # of it on purpose.
          mkdir -p stage/web
          cp -a apps/web/.next/standalone/. stage/web/
          mkdir -p stage/web/apps/web/.next
          cp -a apps/web/.next/static stage/web/apps/web/.next/static
          # api: compiled code, the Prisma schema and migrations (the server
          # generates its client and runs `migrate deploy` from them), and the
          # shared-types package it requires at runtime. Installed on the
          # server with `npm ci --omit=dev`.
          mkdir -p stage/api/apps/api stage/api/packages/shared-types
          cp -a package.json package-lock.json stage/api/
          cp -a apps/api/package.json apps/api/dist apps/api/prisma stage/api/apps/api/
          cp -a packages/shared-types/package.json packages/shared-types/dist stage/api/packages/shared-types/
          du -sh stage/web stage/api

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no, so the job
          # fails instead of handing the key to whatever answers on that port.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # 65002 is Hostinger's SSH port; DEV_SSH_PORT overrides it.
          echo "SSH_CMD=ssh -i $HOME/.ssh/id_deploy -p ${DEPLOY_PORT:-65002} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Upload
        run: |
          set -euo pipefail
          # --delete keeps each site from accumulating files that left the
          # build (old hashed chunks would pile up to the inode limit). It
          # applies only inside the directories listed below, and the excludes
          # are neither uploaded nor deleted: that is what protects each site's
          # credentials and server-side install, so this must never grow
          # --delete-excluded.
          RSYNC_FLAGS=(
            --archive --compress --human-readable --delete
            --exclude=.env --exclude=.env.* --exclude=tmp/
          )
          upload() {  # <stage dir> <server dir> <entries...>
            local from="$1" to="$2"; shift 2
            echo "### $to" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            (cd "$from" && rsync "${RSYNC_FLAGS[@]}" --itemize-changes -e "$SSH_CMD" "$@" \
              "$DEPLOY_USER@$DEPLOY_HOST:$to/") | tail -n 50 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          # web ships its own node_modules (traced by Next); api's are installed
          # on the server, so they are excluded from its upload.
          upload stage/web "$WEB_DIR" apps node_modules package.json
          RSYNC_FLAGS+=(--exclude=node_modules/)
          upload stage/api "$API_DIR" apps packages package.json package-lock.json

      - name: Install and restart
        env:
          # Hostinger's Node.js sites run behind Phusion Passenger, which
          # reloads an app when tmp/restart.txt's mtime changes. Set the
          # repository variable DEV_RESTART_COMMAND if yours restart another way.
          RESTART: ${{ vars.DEV_RESTART_COMMAND }}
        run: |
          set -euo pipefail
          RESTART_CMD="${RESTART:-mkdir -p tmp && touch tmp/restart.txt}"
          # Unquoted heredocs: the runner substitutes the paths and the restart
          # command. The guard has established both paths are absolute, inside
          # their own dev site, and free of '..'.
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" 'bash -seuo pipefail' <<REMOTE
          cd '$API_DIR'
          npm ci --omit=dev --workspace=apps/api --no-audit --no-fund
          # The engine binary must match the server, so generate there.
          npx prisma generate --schema apps/api/prisma/schema.prisma
          $RESTART_CMD
          cd '$WEB_DIR'
          $RESTART_CMD
          REMOTE

      # Migrations are NOT applied: a deploy never alters a database on its
      # own. Apply them over SSH from the API site:
      #   cd <API dir> && npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Report migrations included in this deploy
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          NULL_SHA=0000000000000000000000000000000000000000
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$NULL_SHA" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            added=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- apps/api/prisma/migrations/ | grep '\.sql$' || true)
            scope="new in this push"
          else
            # A manual run or a first push: no range to diff, so name the most
            # recent migration rather than claim there are none.
            added=$(git log -1 --name-only --diff-filter=A --format= -- apps/api/prisma/migrations/ | grep '\.sql$' || true)
            scope="from the most recent commit that added any"
          fi
          if [ -n "$added" ]; then
            {
              echo "### Migrations ($scope)"
              echo
              echo "The code is live, but this workflow does **not** change the schema."
              echo "Confirm these are applied to the dev database:"
              echo
              echo '```'
              echo "$added"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::This deploy ships migrations that it did not apply ($scope)."
          else
            echo "No migrations $scope." >> "$GITHUB_STEP_SUMMARY"
          fi

      # GET /api/v1/health is 200 only when the API also reaches its database.
      - name: Smoke check
        run: |
          set -euo pipefail
          check() {  # <url>
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$1" || echo 000)
              if [ "$code" = 200 ]; then echo "$1 is up."; return 0; fi
              echo "attempt $attempt on $1: HTTP $code"
              [ "$attempt" = 6 ] || sleep 10
            done
            echo "::error::$1 did not come up. Last status: $code"
            head -c 2000 /tmp/body || true
            return 1
          }
          status=0
          if [ -n "$API_SMOKE_URL" ]; then check "$API_SMOKE_URL" || status=1; else echo "DEV_API_SMOKE_URL unset: API smoke check skipped."; fi
          if [ -n "$WEB_SMOKE_URL" ]; then check "$WEB_SMOKE_URL" || status=1; else echo "DEV_SMOKE_URL unset: web smoke check skipped."; fi
          exit $status
