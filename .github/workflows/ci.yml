name: CI

# Runs on every push and pull request to staging and main. The tests exercise
# real Prisma queries and constraints (including the bookings exclusion
# constraint and CITEXT emails), so a PostgreSQL service container matching
# production is provided rather than a mock.
on:
  push:
    # Not dev: a push there runs this same suite inside deploy-dev.yml's gate,
    # so the build that gets published is one that passed.
    branches: [main, staging]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Docker Hub's official image, the one bkesari-platform's CI uses. This
        # was public.ecr.aws/docker/library/postgres:16 to dodge Docker Hub's
        # anonymous rate limit, until ECR Public refused every pull with "Data
        # limit exceeded" (2026-10-24). If Docker Hub's limit bites again,
        # mirror.gcr.io/library/postgres:16 is the next mirror to try.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miladwani_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d miladwani_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The service container above, and nothing else: CI never reaches Neon.
      # One URL is enough here; DATABASE_URL_UNPOOLED falls back to it (see
      # scripts/with-env.js and prisma/schema.prisma).
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/miladwani_test?schema=public
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The test scripts read .env.test (gitignored), so CI writes its own.
      - name: Write .env.test
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/miladwani_test?schema=public
          NEXTAUTH_SECRET=ci-only-secret-not-used-in-production
          NEXTAUTH_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ADMIN_EMAIL=admin@miladwani.com
          ADMIN_PASSWORD=CiOnlyAdmin123!
          SEED_TEST_ACCOUNTS=true
          STORAGE_DRIVER=LOCAL
          UPLOAD_DIR=./uploads-test
          PAYMENT_GATEWAY=MOCK
          PAYMENT_SIGNING_SECRET=ci-only-signing-secret
          ENV

      - name: Apply migrations
        run: npm run test:migrate

      - name: Seed reference and UAT data
        run: |
          node scripts/with-env.js .env.test npm run db:seed
          node scripts/with-env.js .env.test npm run db:seed:uat

      - name: Typecheck
        run: npm run typecheck

      # Errors fail the job; warnings (mostly `any`) are reported only.
      - name: Lint
        run: npm run lint

      # Through with-env.js, which sets DATABASE_URL_UNPOOLED (the schema's
      # directUrl) to DATABASE_URL: CI has one database, Neon has two URLs.
      - name: Check the Prisma schema is valid
        run: node scripts/with-env.js .env.test npx prisma validate

      # basePath does not rewrite fetch(), so a newly added `fetch('/api/...')`
      # typechecks, passes the tests, and then calls the hub's root instead of
      # this app. Nothing else catches that.
      - name: Check every API URL carries BASE_PATH
        run: bash scripts/check-base-path.sh

      # PostgreSQL is the final database (the schema spent Sep-Oct 2026 on
      # MySQL); a provider flipped again would fail only once a real query ran.
      - name: Check the schema still targets PostgreSQL
        run: |
          set -euo pipefail
          grep -qE '^\s*provider\s*=\s*"postgresql"' prisma/schema.prisma \
            || { echo "::error::prisma/schema.prisma no longer targets postgresql"; exit 1; }
          grep -qE '^provider\s*=\s*"postgresql"' prisma/migrations/migration_lock.toml \
            || { echo "::error::prisma/migrations/migration_lock.toml no longer targets postgresql"; exit 1; }

      # The migrations must build exactly the schema in schema.prisma, or
      # `migrate deploy` on a real database would leave it different from what
      # the client expects. Runs against the database "Apply migrations" built.
      - name: Check the migrations match the schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      # The rules that keep a dev deploy off test and production. Cheap, and
      # the one thing here whose failure mode is publishing to the wrong tier.
      - name: Deploy guard rules
        run: bash .github/deploy/guard.test.sh
